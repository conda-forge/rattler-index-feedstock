context:
  name: rattler-index
  version: "0.34.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/conda/rattler/archive/rattler_index-v${{ version }}.tar.gz
  sha256: 162b37e24e7e73b5db8ba88a9372a6c5bd779404410c7d2759866a6f88f81fe6

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - export OPENSSL_DIR=$PREFIX
          # CMake applies jitterentropy's required -O0 after conda's compiler flags.
          - export AWS_LC_SYS_CMAKE_BUILDER=1
          - export CMAKE_GENERATOR=Ninja
      - cd crates/rattler_index
      - cargo-bundle-licenses --format yaml --output ../../THIRDPARTY.yml
      # s3 feature requires rustls which (as of reqwest 0.12) requires ring which is only compatible with clang
      # xref https://github.com/conda/rattler/pull/2033
      - cargo auditable install --no-track --locked --features native-tls${{ ',s3' if target_platform != 'win-arm64' else '' }} --no-default-features --root ${{ PREFIX }} --path .

requirements:
  build:
    - ${{ compiler('c') }}
    - if: unix
      then:
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
  host:
    - openssl
    - libiconv

tests:
  - script:
      - rattler-index --version
  - package_contents:
      bin:
        - rattler-index
      strict: true

about:
  homepage: https://github.com/conda/rattler
  documentation: https://docs.rs/rattler_index/latest/rattler_index
  summary: Index conda channels using rattler
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/conda/rattler/tree/main/crates/rattler_index

extra:
  recipe-maintainers:
    - delsner
    - pavelzw
    - wolfv
